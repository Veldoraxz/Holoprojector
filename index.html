<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Jarvis</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    height: 100%;
    overflow: hidden;
  }
  canvas {
    display: block;
    margin: 0 auto;
  }
  #status {
    position: absolute;
    bottom: 20px;
    width: 100%;
    text-align: center;
    color: #0af;
    font-family: sans-serif;
    font-size: 14px;
  }
  #startBtn {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 20px;
    background: #0af;
    border: none;
    border-radius: 6px;
    color: #000;
    font-weight: bold;
  }
</style>
</head>
<body>

<button id="startBtn">Iniciar Jarvis</button>
<canvas id="orb" width="400" height="400"></canvas>
<div id="status">Esperando...</div>

<script>
// ---------- CONFIG ----------
const GROQ_API_KEY = "TU_API_KEY_ACA"; // pegá tu key de console.groq.com
const GROQ_MODEL = "llama-3.3-70b-versatile";

// ---------- ORBE ANIMADO ----------
const canvas = document.getElementById('orb');
const ctx = canvas.getContext('2d');
let volume = 0; // 0 a 1, controla el "pulso" del orbe
let t = 0;

function drawOrb() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const baseRadius = 80;
  const pulse = baseRadius + Math.sin(t * 0.1) * 5 + volume * 40;

  const gradient = ctx.createRadialGradient(cx, cy, 10, cx, cy, pulse);
  gradient.addColorStop(0, "rgba(0,200,255,0.9)");
  gradient.addColorStop(0.5, "rgba(0,120,255,0.4)");
  gradient.addColorStop(1, "rgba(0,50,150,0)");

  ctx.beginPath();
  ctx.fillStyle = gradient;
  ctx.arc(cx, cy, pulse, 0, Math.PI * 2);
  ctx.fill();

  // anillo
  ctx.beginPath();
  ctx.strokeStyle = "rgba(0,220,255,0.6)";
  ctx.lineWidth = 2;
  ctx.arc(cx, cy, baseRadius + 20 + volume * 20, 0, Math.PI * 2);
  ctx.stroke();

  t++;
  volume *= 0.9; // decae solo si no hay nueva voz
  requestAnimationFrame(drawOrb);
}
drawOrb();

// ---------- RECONOCIMIENTO DE VOZ ----------
const statusEl = document.getElementById('status');
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = new SpeechRecognition();
recognition.lang = "es-AR";
recognition.continuous = false;
recognition.interimResults = false;

recognition.onstart = () => statusEl.textContent = "Escuchando...";
recognition.onerror = (e) => statusEl.textContent = "Error: " + e.error;

recognition.onresult = async (event) => {
  const texto = event.results[0][0].transcript;
  statusEl.textContent = "Vos: " + texto;
  const respuesta = await preguntarGroq(texto);
  statusEl.textContent = "Jarvis: " + respuesta;
  hablar(respuesta);
};

recognition.onend = () => {
  // vuelve a escuchar automáticamente después de hablar
  setTimeout(() => recognition.start(), 1000);
};

// ---------- LLAMADA A GROQ ----------
async function preguntarGroq(texto) {
  statusEl.textContent = "Pensando...";
  try {
    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + GROQ_API_KEY
      },
      body: JSON.stringify({
        model: GROQ_MODEL,
        messages: [
          { role: "system", content: "Sos Jarvis, un asistente conciso y directo. Respondé corto, en español rioplatense." },
          { role: "user", content: texto }
        ]
      })
    });
    const data = await response.json();
    return data.choices[0].message.content;
  } catch (err) {
    console.error(err);
    return "Tuve un problema para responder.";
  }
}

// ---------- SÍNTESIS DE VOZ ----------
function hablar(texto) {
  const utter = new SpeechSynthesisUtterance(texto);
  utter.lang = "es-AR";

  // simula el "volumen" del orbe mientras habla
  const interval = setInterval(() => {
    volume = Math.random() * 0.8;
  }, 100);

  utter.onend = () => {
    clearInterval(interval);
    volume = 0;
  };

  speechSynthesis.speak(utter);
}

// ---------- BOTÓN DE INICIO ----------
document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('startBtn').style.display = "none";
  recognition.start();
});
</script>
</body>
</html>
