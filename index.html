<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Kit</title>
<style>
  :root {
    --bg: #000000;
    --line: rgba(255, 160, 180, 0.42);
    --pink: #ff8da1;
    --pink-soft: rgba(255, 141, 161, 0.8);
    --text: rgba(255,255,255,0.9);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
  }

  body {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }

  .hud {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: rgba(0, 0, 0, 0);
  }

  canvas {
    display: block;
    width: min(80vmin, 500px);
    height: min(80vmin, 500px);
    filter: drop-shadow(0 0 24px rgba(255, 130, 160, 0.35));
    opacity: 0.98;
    background: transparent;
  }

  #subtitles {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 122px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 10px;
    padding: 0 26px;
    pointer-events: none;
  }

  .word {
    color: rgba(255,255,255,0.9);
    font-size: clamp(14px, 2.2vmin, 18px);
    line-height: 1.4;
    opacity: 1;
    transition: opacity 0.9s ease, transform 0.9s ease;
    transform: translateY(0);
    text-shadow: 0 0 12px rgba(255,255,255,0.2);
  }

  .word.fading {
    opacity: 0;
    transform: translateY(4px);
  }

  #status {
    position: absolute;
    left: 50%;
    bottom: 82px;
    transform: translateX(-50%);
    width: min(90vw, 700px);
    text-align: center;
    color: var(--pink);
    font-size: 13px;
    letter-spacing: 0.04em;
    opacity: 0.8;
    text-shadow: 0 0 12px rgba(255, 141, 161, 0.3);
    pointer-events: none;
  }

  #startBtn {
    position: absolute;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    padding: 12px 28px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.02);
    color: var(--pink-soft);
    font-size: 13px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 0 18px rgba(255, 141, 161, 0.12);
  }

  #startBtn:hover {
    transform: translateX(-50%) scale(1.02);
    box-shadow: 0 0 22px rgba(255, 141, 161, 0.2);
  }
</style>
</head>
<body>

<button id="startBtn">Iniciar Kit</button>
<canvas id="orb" width="600" height="600"></canvas>
<div id="subtitles"></div>
<div id="status">Esperando...</div>

<script>
  const GROQ_API_KEY = "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";
  const GROQ_MODEL = "openai/gpt-oss-120b";
  const assistantName = "Kit";
  const statusEl = document.getElementById('status');
  const subtitlesEl = document.getElementById('subtitles');
  const startBtn = document.getElementById('startBtn');

  let isSpeaking = false;
  let voiceIntensity = 0;
  let speechPulseTimer = null;

  const canvas = document.getElementById('orb');
  const ctx = canvas.getContext('2d');
  let t = 0;

  function drawOrb() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const baseRadius = 118;
    const pulse = baseRadius + Math.sin(t * 0.09) * 6 + voiceIntensity * 28;

    const glow = ctx.createRadialGradient(cx, cy, 12, cx, cy, pulse + 70);
    glow.addColorStop(0, 'rgba(255, 210, 220, 0.82)');
    glow.addColorStop(0.22, 'rgba(255, 170, 190, 0.5)');
    glow.addColorStop(0.52, 'rgba(255, 120, 150, 0.22)');
    glow.addColorStop(1, 'rgba(255, 90, 130, 0)');

    ctx.beginPath();
    ctx.fillStyle = glow;
    ctx.arc(cx, cy, pulse + 58, 0, Math.PI * 2);
    ctx.fill();

    const core = ctx.createRadialGradient(cx, cy, 10, cx, cy, pulse);
    core.addColorStop(0, 'rgba(255,245,248,0.85)');
    core.addColorStop(0.2, 'rgba(255,188,204,0.75)');
    core.addColorStop(0.55, 'rgba(255,140,170,0.42)');
    core.addColorStop(1, 'rgba(255,115,150,0)');

    ctx.beginPath();
    ctx.fillStyle = core;
    ctx.arc(cx, cy, pulse, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.strokeStyle = 'rgba(255, 150, 180, 0.6)';
    ctx.lineWidth = 2;
    ctx.arc(cx, cy, baseRadius + 14 + voiceIntensity * 12, 0, Math.PI * 2);
    ctx.stroke();

    t += 1;
    voiceIntensity *= 0.88;
    requestAnimationFrame(drawOrb);
  }

  drawOrb();

  function triggerPulse(intensity) {
    voiceIntensity = Math.max(voiceIntensity, Math.min(0.9, intensity));
  }

  function startSpeechPulseLoop() {
    if (speechPulseTimer) clearInterval(speechPulseTimer);

    speechPulseTimer = setInterval(() => {
      if (!isSpeaking) return;
      const intensity = 0.2 + Math.random() * 0.35;
      triggerPulse(intensity);
    }, 170);
  }

  function stopSpeechPulseLoop() {
    if (speechPulseTimer) {
      clearInterval(speechPulseTimer);
      speechPulseTimer = null;
    }
    voiceIntensity = 0;
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'es-AR';
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = () => {
      statusEl.textContent = 'Escuchando...';
    };

    recognition.onerror = (event) => {
      console.error('SpeechRecognition error:', event.error);
      statusEl.textContent = 'No pude escuchar. Reintentando...';
      if (!isSpeaking) {
        setTimeout(() => {
          try { recognition.start(); } catch (err) {}
        }, 1200);
      }
    };

    recognition.onresult = async (event) => {
      const texto = event.results[0][0].transcript.trim();
      if (!texto) return;

      statusEl.textContent = 'Vos: ' + texto;
      const respuesta = await preguntarGroq(texto);
      statusEl.textContent = 'Kit: ' + respuesta;
      hablar(respuesta);
    };

    recognition.onend = () => {
      if (!isSpeaking) {
        try {
          setTimeout(() => recognition.start(), 250);
        } catch (err) {
          console.warn('No se pudo reiniciar el reconocimiento:', err);
        }
      }
    };
  }

  async function preguntarGroq(texto) {
    statusEl.textContent = 'Pensando...';

    try {
      const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + GROQ_API_KEY
        },
        body: JSON.stringify({
          model: GROQ_MODEL,
          messages: [
            {
              role: 'system',
              content: 'Sos ' + assistantName + ', un asistente útil, corto y amable, con tono andrógino y estilo rioplatense. Responde en español, con frases naturales, precisas y cálidas. Máximo 2 frases por respuesta.'
            },
            { role: 'user', content: texto }
          ]
        })
      });

      const data = await response.json();
      if (!response.ok) {
        console.error(data);
        return 'No pude responder ahora mismo.';
      }

      return (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content)
        ? data.choices[0].message.content.trim()
        : 'No pude responder ahora mismo.';
    } catch (error) {
      console.error('Error Groq:', error);
      return 'No pude procesar la respuesta.';
    }
  }

  function chooseSpanishVoice() {
    if (!('speechSynthesis' in window)) return null;
    const voices = window.speechSynthesis.getVoices();
    const preferred = ['es-AR', 'es-ES', 'es'];

    for (const lang of preferred) {
      const match = voices.find(v => v.lang && v.lang.toLowerCase().startsWith(lang.toLowerCase()));
      if (match) return match;
    }

    return voices.find(v => /es/i.test(v.lang)) || voices[0] || null;
  }

  function showWords(text) {
    subtitlesEl.innerHTML = '';
    const words = text.split(/\s+/).filter(Boolean);
    if (!words.length) return;

    const approxMs = Math.max(440, Math.min(900, 2600 / words.length));
    words.forEach((word, index) => {
      setTimeout(() => {
        const span = document.createElement('span');
        span.className = 'word';
        span.textContent = word;
        subtitlesEl.appendChild(span);

        setTimeout(() => {
          span.classList.add('fading');
          setTimeout(() => span.remove(), 900);
        }, 1800);
      }, index * approxMs);
    });
  }

  function hablar(texto) {
    if (!texto || !('speechSynthesis' in window)) {
      isSpeaking = false;
      statusEl.textContent = 'La voz del sistema no está disponible en este navegador.';
      return;
    }

    isSpeaking = true;
    window.speechSynthesis.cancel();
    subtitlesEl.innerHTML = '';

    const utterance = new SpeechSynthesisUtterance(texto);
    utterance.lang = 'es-AR';
    utterance.rate = 1;
    utterance.pitch = 1.15;
    utterance.volume = 1;

    const voice = chooseSpanishVoice();
    if (voice) utterance.voice = voice;

    utterance.onstart = () => {
      isSpeaking = true;
      statusEl.textContent = 'Kit hablando...';
      showWords(texto);
      startSpeechPulseLoop();
    };

    utterance.onboundary = () => {
      triggerPulse(0.9);
    };

    utterance.onend = () => {
      isSpeaking = false;
      stopSpeechPulseLoop();
      statusEl.textContent = 'Escuchando...';
      setTimeout(() => {
        if (recognition) {
          try { recognition.start(); } catch (err) {}
        }
      }, 500);
    };

    utterance.onerror = () => {
      isSpeaking = false;
      statusEl.textContent = 'Error de voz del sistema.';
    };

    window.speechSynthesis.speak(utterance);
  }

  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = () => {
      const voices = window.speechSynthesis.getVoices();
      if (voices.length) {
        statusEl.textContent = 'Listo para hablar.';
      }
    };
  }

  startBtn.addEventListener('click', () => {
    startBtn.style.display = 'none';
    if (recognition) {
      try {
        recognition.start();
      } catch (err) {
        console.warn('El reconocimiento ya está activo:', err);
      }
    } else {
      statusEl.textContent = 'Este navegador no soporta reconocimiento de voz.';
    }
  });
</script>
</body>
</html>
