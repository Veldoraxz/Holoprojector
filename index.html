<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kit</title>
<style>
  :root {
    --line: rgba(255, 160, 180, 0.42);
    --pink: #ff8da1;
    --pink-rgb: 255, 141, 161;
    --pink-soft: rgba(255, 141, 161, 0.8);
    --text: rgba(255,255,255,0.9);
    --panel: #110a0e;
  }

  body.palette-azul {
    --line: rgba(150, 180, 255, 0.42);
    --pink: #8db4ff;
    --pink-rgb: 141, 180, 255;
    --pink-soft: rgba(141, 180, 255, 0.8);
  }

  body.light {
    --text: rgba(50, 25, 40, 0.92);
    --panel: #fff7f9;
    --pink: #c04567;
    --pink-soft: rgba(192, 69, 103, 0.85);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
  }

  body {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }

  /* Preview mode: gradient only (degrades Pepper's Ghost - usar solo sin acrílico) */
  body.theme-preview {
    background:
      radial-gradient(120% 90% at 70% 0%, rgba(90, 20, 60, 0.55), transparent 55%),
      radial-gradient(110% 90% at 15% 110%, rgba(20, 50, 110, 0.5), transparent 55%),
      #0b0610;
  }

  body.theme-preview.light {
    background:
      radial-gradient(120% 90% at 70% 0%, rgba(255, 180, 200, 0.5), transparent 55%),
      radial-gradient(110% 90% at 15% 110%, rgba(160, 200, 255, 0.45), transparent 55%),
      #fdf3f6;
  }

  canvas {
    display: block;
    width: min(80vmin, 500px);
    height: min(80vmin, 500px);
    filter: drop-shadow(0 0 24px rgba(255, 130, 160, 0.35));
    opacity: 0.98;
    background: transparent;
    transition: transform 0.25s ease, filter 0.25s ease;
  }

  @media (max-width: 768px) {
    canvas {
      width: min(92vw, 700px);
      height: min(92vw, 700px);
    }
  }

  /* ---------- Controles superiores ---------- */
  #topBar, #presetBar {
    position: absolute;
    top: 14px;
    z-index: 5;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  #topBar { right: 14px; justify-content: flex-end; }
  #presetBar { left: 14px; }

  .ctrl, .preset {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--line);
    color: var(--pink-soft);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 5px 10px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
  }

  .ctrl:hover, .preset:hover, .preset.active {
    color: #fff;
    background: rgba(var(--pink-rgb), 0.12);
    box-shadow: 0 0 10px rgba(var(--pink-rgb), 0.15);
  }

  .hidden { display: none !important; }

  @media (max-width: 768px) {
    #topBar, #presetBar { top: 10px; }
    .ctrl, .preset { font-size: 9px; padding: 4px 8px; }
  }

  /* ---------- Indicadores (contador + calidad) ---------- */
  #metaRow {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 14px;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: rgba(var(--pink-rgb), 0.65);
    z-index: 4;
    text-shadow: 0 0 8px rgba(0,0,0,0.6);
    white-space: nowrap;
  }

  #qualityBar {
    position: absolute;
    top: 34px;
    left: 50%;
    transform: translateX(-50%);
    width: min(50vw, 260px);
    height: 4px;
    border-radius: 99px;
    background: rgba(255,255,255,0.06);
    overflow: hidden;
    z-index: 4;
  }

  #qualityFill {
    height: 100%;
    width: 0%;
    background: var(--pink);
    border-radius: 99px;
    transition: width 0.6s ease;
    box-shadow: 0 0 8px rgba(var(--pink-rgb), 0.5);
  }

  /* ---------- Subtítulos ---------- */
  #subtitles {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 122px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 10px;
    padding: 0 26px;
    pointer-events: none;
  }

  .word {
    color: rgba(255,255,255,0.9);
    font-size: clamp(14px, 2.2vmin, 18px);
    line-height: 1.4;
    opacity: 1;
    transition: opacity 0.9s ease, transform 0.9s ease;
    transform: scale(0.95) translateY(2px);
    text-shadow: 0 0 12px rgba(255,255,255,0.2);
    animation: wordEntry 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  body.light .word {
    color: var(--text);
    text-shadow: none;
  }

  @keyframes wordEntry {
    from { opacity: 0; transform: scale(0.85) translateY(6px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .word.fading { opacity: 0; transform: translateY(4px); }

  /* ---------- Status ---------- */
  #status {
    position: absolute;
    left: 50%;
    bottom: 82px;
    transform: translateX(-50%);
    width: min(90vw, 700px);
    text-align: center;
    color: var(--pink);
    font-size: 13px;
    letter-spacing: 0.04em;
    opacity: 0.8;
    text-shadow: 0 0 12px rgba(var(--pink-rgb), 0.3);
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
    transform: translateX(-50%) translateY(0);
  }

  body.light #status { text-shadow: none; }

  #status.fade-in { animation: statusFadeIn 0.4s ease-out forwards; }

  @keyframes statusFadeIn {
    from { opacity: 0; transform: translateX(-50%) translateY(4px); }
    to { opacity: 0.8; transform: translateX(-50%) translateY(0); }
  }

  /* ---------- Botones principales ---------- */
  #startBtn {
    position: absolute;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    min-width: 190px;
    width: fit-content;
    padding: 12px 22px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.02);
    color: var(--pink-soft);
    font-size: 13px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, color 0.2s ease;
    box-shadow: 0 0 18px rgba(var(--pink-rgb), 0.12);
    white-space: nowrap;
  }

  #startBtn:hover {
    transform: translateX(-50%) scale(1.02);
    box-shadow: 0 0 22px rgba(var(--pink-rgb), 0.2);
    color: #fff;
  }

  #startBtn.loading {
    opacity: 0.75;
    cursor: default;
  }

  #startBtn.loading .btn-label { opacity: 0.55; }

  #startBtn.loading::after {
    content: '';
    display: inline-block;
    width: 12px;
    height: 12px;
    margin-left: 8px;
    vertical-align: -2px;
    border: 2px solid rgba(var(--pink-rgb), 0.25);
    border-top-color: var(--pink);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  #newConvBtn {
    position: absolute;
    left: 50%;
    bottom: 70px;
    transform: translateX(-50%);
    width: fit-content;
    padding: 8px 18px;
    border-radius: 999px;
    border: 1px solid rgba(255, 160, 180, 0.25);
    background: rgba(255, 100, 130, 0.05);
    color: rgba(var(--pink-rgb), 0.6);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: none;
    white-space: nowrap;
    display: none;
  }

  #newConvBtn.show { display: block; }

  #newConvBtn:hover {
    background: rgba(var(--pink-rgb), 0.1);
    color: rgba(var(--pink-rgb), 0.9);
    border-color: rgba(255, 160, 180, 0.4);
    box-shadow: 0 0 12px rgba(var(--pink-rgb), 0.1);
  }

  /* ---------- Overlay de historial ---------- */
  #historyOverlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.72);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 20;
  }

  #historyOverlay.show { display: flex; }

  #historyBox {
    width: min(92vw, 560px);
    max-height: 70vh;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
  }

  #historyHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    color: var(--pink);
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  #historyClose {
    background: none;
    border: 1px solid var(--line);
    color: var(--pink-soft);
    border-radius: 999px;
    cursor: pointer;
    padding: 3px 10px;
    font-size: 12px;
  }

  #historyBody { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }

  .h-entry {
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 13px;
    line-height: 1.45;
    word-break: break-word;
  }

  .h-entry.user {
    background: rgba(var(--pink-rgb), 0.07);
    border: 1px solid rgba(var(--pink-rgb), 0.14);
    align-self: flex-start;
    max-width: 85%;
  }

  .h-entry.assistant {
    background: rgba(150, 210, 255, 0.06);
    border: 1px solid rgba(150, 210, 255, 0.12);
    align-self: flex-end;
    max-width: 85%;
  }

  .h-meta {
    display: flex;
    gap: 8px;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.7;
    margin-bottom: 3px;
  }
</style>
</head>
<body>

<div id="presetBar">
  <button class="preset active" data-preset="serious" title="Voz seria">Serio</button>
  <button class="preset" data-preset="cheeky" title="Voz picarona">Picarón</button>
  <button class="preset" data-preset="calm" title="Voz calma">Calmado</button>
</div>

<div id="topBar">
  <button class="ctrl" id="viewModeBtn" title="Modo de visualización">Proyección</button>
  <button class="ctrl hidden" id="paletteBtn" title="Paleta de color">Rosa</button>
  <button class="ctrl hidden" id="themeBtn" title="Tema claro/oscuro">Oscuro</button>
  <button class="ctrl" id="historyBtn" title="Ver historial completo">Historial</button>
</div>

<div id="metaRow">
  <span id="msgCount">Mensajes: 0</span>
  <span id="qualityPct">Calidad: —</span>
</div>
<div id="qualityBar"><div id="qualityFill"></div></div>

<button id="startBtn"><span class="btn-label">Iniciar</span></button>
<button id="newConvBtn">Nueva conversación</button>
<canvas id="orb" width="600" height="600"></canvas>
<div id="subtitles"></div>
<div id="status">Esperando...</div>

<div id="historyOverlay">
  <div id="historyBox">
    <div id="historyHeader">
      <span>Historial</span>
      <button id="historyClose">✕</button>
    </div>
    <div id="historyBody"></div>
  </div>
</div>

<script>
  'use strict';

  // ---------- CONFIG ----------
  // Frontend y backend viven en el mismo origen (Railway sirve index.html con express.static).
  // GitHub Pages quedó deprecado: la ruta relativa /api/chat funciona en Railway y en local (node server.js).
  const API_BASE = '';

  const assistantName = 'Kit';

  const RESTART_DELAY_MS = 250;
  const SPEECH_PULSE_INTERVAL_MS = 170;
  const WORD_DELAY_MS = 380;
  const WORD_FADE_DELAY_MS = 650;
  const SEVEN_DAYS_MS = 7 * 24 * 60 * 60 * 1000;

  const PERSISTENT_KEY = 'holoprojector_conversation_history';
  const SESSION_MODE_KEY = 'holoprojector_mode';
  const SESSION_PRESET_KEY = 'holoprojector_voice_preset';
  const SESSION_VIEW_KEY = 'holoprojector_view_mode';
  const SESSION_PALETTE_KEY = 'holoprojector_palette';
  const SESSION_THEME_KEY = 'holoprojector_theme';

  const PRESETS = ['serious', 'cheeky', 'calm'];
  const PRESET_LABELS = { serious: 'Serio', cheeky: 'Picarón', calm: 'Calmado' };

  const TONE_VOICE = {
    question:   { pitch: 1.25, rate: 1.0  },
    affirmation:{ pitch: 1.2,  rate: 1.05 },
    sarcasm:    { pitch: 0.95, rate: 0.95 },
    confused:   { pitch: 1.35, rate: 1.1  },
    negative:   { pitch: 0.9,  rate: 0.9  },
    neutral:    { pitch: 1.15, rate: 1.0  }
  };

  const PRESET_VOICE = {
    serious: { pitch: 0.95, rate: 0.95 },
    cheeky:  { pitch: 1.15, rate: 1.1  },
    calm:    { pitch: 1.0,  rate: 0.88 }
  };

  let conversationHistory = [];
  let responseMode = 'compact';
  let currentSpeechId = 0;
  let hasStartedOnce = false;
  let currentTone = 'neutral';
  let orbColorOverride = null;
  let sessionMsgCount = 0;

  // Preferencias de sesión
  let activePreset = 'serious';
  let viewMode = 'projection';
  let paletteMode = 'rosa';
  let themeMode = 'dark';

  function readSession(key, fallback) {
    try {
      const value = sessionStorage.getItem(key);
      return value === null ? fallback : value;
    } catch (err) {
      return fallback;
    }
  }

  function writeSession(key, value) {
    try {
      sessionStorage.setItem(key, value);
    } catch (err) {
      console.warn('No se pudo guardar la preferencia:', err);
    }
  }

  // ---------- Carga persistente ----------
  function loadPersistentState() {
    try {
      const saved = localStorage.getItem(PERSISTENT_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed)) {
          conversationHistory = parsed;
        }
      }
      const savedMode = localStorage.getItem(SESSION_MODE_KEY);
      if (savedMode === 'compact' || savedMode === 'detailed') {
        responseMode = savedMode;
      }
    } catch (err) {
      console.warn('No se pudo restaurar la historia persistente:', err);
    }

    // Limpieza automática: conversaciones de más de 7 días
    const now = Date.now();
    let changed = false;
    const fresh = [];
    for (const msg of conversationHistory) {
      const ts = typeof msg.ts === 'number' ? msg.ts : now;
      if (now - ts <= SEVEN_DAYS_MS) {
        fresh.push(Object.assign({}, msg, { ts }));
      } else {
        changed = true;
      }
    }
    if (changed || conversationHistory.some(msg => typeof msg.ts !== 'number')) {
      conversationHistory = fresh;
      persistSession();
    }

    activePreset = readSession(SESSION_PRESET_KEY, 'serious');
    if (!PRESETS.includes(activePreset)) activePreset = 'serious';
    viewMode = readSession(SESSION_VIEW_KEY, 'projection');
    paletteMode = readSession(SESSION_PALETTE_KEY, 'rosa');
    themeMode = readSession(SESSION_THEME_KEY, 'dark');
  }

  const interruptResponses = [
    { text: '¿eh?', tone: 'confused' },
    { text: 'Dale, me callé.', tone: 'compliant' },
    { text: 'Bueno, bueno...', tone: 'compliant' },
    { text: 'Me cortaste en lo mejor.', tone: 'sarcastic' },
    { text: 'Ñeeee...', tone: 'confused' },
    { text: 'Ok, ok, me silenciás.', tone: 'compliant' },
    { text: 'Ay, espera que iba para mejor esto.', tone: 'sarcastic' }
  ];

  const statusEl = document.getElementById('status');
  const subtitlesEl = document.getElementById('subtitles');
  const startBtn = document.getElementById('startBtn');
  const newConvBtn = document.getElementById('newConvBtn');
  const msgCountEl = document.getElementById('msgCount');
  const qualityPctEl = document.getElementById('qualityPct');
  const qualityFillEl = document.getElementById('qualityFill');
  const historyOverlayEl = document.getElementById('historyOverlay');
  const historyBodyEl = document.getElementById('historyBody');
  const presetBtns = Array.from(document.querySelectorAll('.preset'));
  let subtitleTimers = [];

  function setBtnLabel(text) {
    const label = startBtn.querySelector('.btn-label');
    if (label) label.textContent = text;
  }

  function setStatus(message) {
    statusEl.classList.remove('fade-in');
    void statusEl.offsetWidth;
    statusEl.textContent = message;
    statusEl.classList.add('fade-in');
  }

  // ---------- SONIDOS ----------
  function playSound(type) {
    try {
      const audioContext = window.audioContext || (window.audioContext = new (window.AudioContext || window.webkitAudioContext)());
      const now = audioContext.currentTime;

      if (type === 'activate') {
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(650, now + 0.15);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.02, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'deactivate') {
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.frequency.setValueAtTime(380, now);
        osc.frequency.exponentialRampToValueAtTime(200, now + 0.12);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      } else if (type === 'bip') {
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.frequency.setValueAtTime(880, now);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'click') {
        // Click suave y discreto
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1400, now);
        osc.frequency.exponentialRampToValueAtTime(700, now + 0.05);
        gain.gain.setValueAtTime(0.035, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
        osc.start(now);
        osc.stop(now + 0.06);
      }
    } catch (err) {
      console.warn('Audio not available:', err);
    }
  }

  // ---------- ALMACENAMIENTO ----------
  function persistSession() {
    try {
      localStorage.setItem(PERSISTENT_KEY, JSON.stringify(conversationHistory));
      localStorage.setItem(SESSION_MODE_KEY, responseMode);
    } catch (err) {
      console.warn('No se pudo guardar la historia:', err);
    }
  }

  function clearConversation() {
    conversationHistory = [];
    sessionMsgCount = 0;
    persistSession();
    updateMeta();
    setStatus('Conversación limpia. Listos para empezar.');
    playSound('activate');
  }

  // ---------- TONO ----------
  function detectTone(text) {
    const lowerText = text.toLowerCase();

    if (/^[^.!?]*\?/.test(lowerText) || /^¿/.test(lowerText)) return 'question';

    if (/^(sí|si|claro|dale|hecho|listo|perfecto|ok|okey|bueno)\b/i.test(lowerText)) return 'affirmation';

    if (/jejej|jajaj|haha|😏|pero bueno|mirá que|vos decí/.test(lowerText)) return 'sarcasm';

    if (/no sé|no estoy seguro|creo que|capaz que|quizás|dudoso/.test(lowerText)) return 'confused';

    if (/no|mal|horrible|odio|peor|nunca|jamás|imposible/.test(lowerText)) return 'negative';

    return 'neutral';
  }

  function colorRgb(rgbaStr) {
    const parts = rgbaStr.match(/\d+(\.\d+)?/g);
    return parts ? parts.slice(0, 3).join(', ') : '255,255,255';
  }

  function getOrbColor(tone) {
    const colors = {
      question: {
        glow: ['rgba(150, 210, 255, 0.82)', 'rgba(100, 180, 240, 0.5)', 'rgba(80, 160, 220, 0.22)'],
        core: ['rgba(200,240,255,0.92)', 'rgba(150,210,255,0.85)', 'rgba(100,180,240,0.75)', 'rgba(80,160,220,0.42)'],
        ring: 'rgba(100, 180, 220, 0.6)'
      },
      affirmation: {
        glow: ['rgba(255, 230, 150, 0.82)', 'rgba(255, 200, 100, 0.5)', 'rgba(255, 170, 80, 0.22)'],
        core: ['rgba(255,250,200,0.92)', 'rgba(255,230,150,0.85)', 'rgba(255,200,100,0.75)', 'rgba(255,170,80,0.42)'],
        ring: 'rgba(255, 200, 100, 0.6)'
      },
      sarcasm: {
        glow: ['rgba(200, 150, 255, 0.82)', 'rgba(180, 120, 240, 0.5)', 'rgba(160, 100, 220, 0.22)'],
        core: ['rgba(230,210,255,0.92)', 'rgba(210,180,255,0.85)', 'rgba(190,150,240,0.75)', 'rgba(160,120,220,0.42)'],
        ring: 'rgba(180, 120, 240, 0.6)'
      },
      confused: {
        glow: ['rgba(255, 180, 180, 0.82)', 'rgba(240, 150, 150, 0.5)', 'rgba(220, 120, 120, 0.22)'],
        core: ['rgba(255,220,220,0.92)', 'rgba(255,190,190,0.85)', 'rgba(240,150,150,0.75)', 'rgba(220,120,120,0.42)'],
        ring: 'rgba(240, 150, 150, 0.6)'
      },
      negative: {
        glow: ['rgba(150, 100, 150, 0.82)', 'rgba(120, 80, 120, 0.5)', 'rgba(100, 60, 100, 0.22)'],
        core: ['rgba(200,170,200,0.92)', 'rgba(180,150,180,0.85)', 'rgba(150,120,150,0.75)', 'rgba(120,90,120,0.42)'],
        ring: 'rgba(150, 120, 150, 0.6)'
      },
      neutral: {
        glow: ['rgba(255, 210, 220, 0.82)', 'rgba(255, 170, 190, 0.5)', 'rgba(255, 120, 150, 0.22)'],
        core: ['rgba(255,245,248,0.92)', 'rgba(255,210,220,0.85)', 'rgba(255,188,204,0.75)', 'rgba(255,140,170,0.42)'],
        ring: 'rgba(255, 150, 180, 0.6)'
      },
      thinking: {
        glow: ['rgba(160, 200, 255, 0.8)', 'rgba(120, 170, 240, 0.5)', 'rgba(90, 140, 220, 0.2)'],
        core: ['rgba(220,235,255,0.92)', 'rgba(180,210,255,0.85)', 'rgba(140,180,240,0.75)', 'rgba(100,150,220,0.4)'],
        ring: 'rgba(140, 180, 240, 0.6)'
      }
    };

    if (tone === 'neutral' && paletteMode === 'azul') {
      return {
        glow: ['rgba(170, 205, 255, 0.82)', 'rgba(130, 175, 245, 0.5)', 'rgba(90, 145, 225, 0.22)'],
        core: ['rgba(235,244,255,0.92)', 'rgba(200,222,255,0.85)', 'rgba(170,200,250,0.75)', 'rgba(120,165,235,0.42)'],
        ring: 'rgba(140, 180, 240, 0.6)'
      };
    }

    return colors[tone] || colors.neutral;
  }

  // ---------- ORBE ----------
  let isSpeaking = false;
  let isProcessing = false;
  let isListening = false;
  let voiceIntensity = 0;
  let speechPulseTimer = null;
  let wordPulseTime = 0;
  let parallaxRotation = 0;
  let rippleActive = false;
  let rippleTime = 0;
  let rippleMaxRadius = 200;
  let mouseNX = 0;
  let mouseNY = 0;

  const canvas = document.getElementById('orb');
  const ctx = canvas.getContext('2d');
  let t = 0;

  function clamp(v, min, max) {
    return Math.min(max, Math.max(min, v));
  }

  function drawOrb() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const isThinking = isProcessing && !isSpeaking;
    const cx = canvas.width / 2 + mouseNX * 8;
    const cy = canvas.height / 2 + mouseNY * 6;
    const isMobile = window.innerWidth <= 768;
    const baseRadius = isMobile ? 148 : 118;
    const pulseSpeed = isThinking ? 0.045 : 0.09;
    const pulse = baseRadius + Math.sin(t * pulseSpeed) * (4 + (isThinking ? 4 : 0)) + voiceIntensity * 28;

    // Parallax: rota a velocidades distintas según la capa
    parallaxRotation += isThinking ? 0.02 : 0.0015;

    const tone = orbColorOverride || (isThinking ? 'thinking' : currentTone);
    const orbColors = getOrbColor(tone);

    // ===== LAYER 1: ANILLOS ORBITALES DE PARALLAX =====
    for (let ring = 0; ring < 3; ring++) {
      const speed = 1 + ring * 0.45;
      const angle = parallaxRotation * speed + ring * 2.2;
      const orbitRadius = pulse + 70 + ring * 20;
      const rx = cx + Math.cos(angle) * orbitRadius;
      const ry = cy + Math.sin(angle) * orbitRadius * 0.45;
      const alpha = (0.3 - ring * 0.09) * (1 - Math.abs(Math.sin(t * 0.02 + ring))) + (isThinking ? 0.05 : 0);

      ctx.beginPath();
      ctx.strokeStyle = `rgba(${colorRgb(orbColors.ring)}, ${clamp(alpha, 0, 0.4)})`;
      ctx.lineWidth = 1.5 - ring * 0.3;
      ctx.arc(rx, ry, 14 - ring * 2, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Halo base tenue (ancla visual, sin parallax visible)
    ctx.beginPath();
    ctx.strokeStyle = `rgba(${colorRgb(orbColors.ring)}, 0.14)`;
    ctx.lineWidth = 1;
    ctx.arc(cx, cy, pulse + 88, 0, Math.PI * 2);
    ctx.stroke();

    // ===== LAYER 2: RESPLANDOR CON PARALLAX PROPIO =====
    const glowCx = cx + Math.cos(parallaxRotation * 0.7) * 7;
    const glowCy = cy + Math.sin(parallaxRotation * 0.7) * 7;
    const glow = ctx.createRadialGradient(glowCx, glowCy, 12, cx, cy, pulse + 70);
    glow.addColorStop(0, orbColors.glow[0]);
    glow.addColorStop(0.22, orbColors.glow[1]);
    glow.addColorStop(0.52, orbColors.glow[2]);
    glow.addColorStop(1, orbColors.glow[2].replace(/0\.\d+/, '0'));

    ctx.beginPath();
    ctx.fillStyle = glow;
    ctx.arc(cx, cy, pulse + 58, 0, Math.PI * 2);
    ctx.fill();

    // ===== LAYER 3: NÚCLEO (multi-stop) =====
    const coreCx = cx + Math.cos(parallaxRotation * 0.4) * 4;
    const coreCy = cy + Math.sin(parallaxRotation * 0.4) * 4;
    const core = ctx.createRadialGradient(coreCx, coreCy, 10, cx, cy, pulse);
    core.addColorStop(0, orbColors.core[0]);
    core.addColorStop(0.15, orbColors.core[1]);
    core.addColorStop(0.35, orbColors.core[2]);
    core.addColorStop(0.55, orbColors.core[3]);
    core.addColorStop(0.8, orbColors.core[3].replace(/0\.\d+/, '0.15'));
    core.addColorStop(1, orbColors.core[3].replace(/0\.\d+/, '0'));

    ctx.beginPath();
    ctx.fillStyle = core;
    ctx.arc(cx, cy, pulse, 0, Math.PI * 2);
    ctx.fill();

    // ===== LAYER 4: REFLEJO DINÁMICO =====
    const reflectX = cx + Math.cos(t * 0.01 + parallaxRotation * 0.5) * 12;
    const reflectY = cy - 30 + voiceIntensity * 15;
    const reflect = ctx.createRadialGradient(reflectX, reflectY, 2, reflectX, reflectY, pulse * 0.4);
    reflect.addColorStop(0, 'rgba(255,255,255,0.15)');
    reflect.addColorStop(0.5, 'rgba(255,240,245,0.05)');
    reflect.addColorStop(1, 'rgba(255,240,245,0)');

    ctx.beginPath();
    ctx.fillStyle = reflect;
    ctx.arc(cx, cy, pulse * 0.5, 0, Math.PI * 2);
    ctx.fill();

    // ===== LAYER 5: ANILLO PULSANTE (reactivo a voz) =====
    ctx.beginPath();
    ctx.strokeStyle = `rgba(${colorRgb(orbColors.ring)}, ${0.6 + voiceIntensity * 0.3})`;
    ctx.lineWidth = 2 + voiceIntensity * 1.5;
    ctx.arc(cx, cy, baseRadius + 14 + voiceIntensity * 12, 0, Math.PI * 2);
    ctx.stroke();

    // ===== LAYER 6: CÍRCULO ACCENT INTERNO =====
    ctx.beginPath();
    ctx.strokeStyle = `rgba(${colorRgb(orbColors.ring)}, ${0.3 + Math.sin(t * 0.05) * 0.2})`;
    ctx.lineWidth = 1;
    ctx.arc(cx, cy, pulse * 0.65, 0, Math.PI * 2);
    ctx.stroke();

    // ===== INDICADOR "PENSANDO": anillo punteado que rota =====
    if (isThinking) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(parallaxRotation * 2);
      ctx.setLineDash([10, 8]);
      ctx.strokeStyle = 'rgba(160, 200, 255, 0.45)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, pulse + 30, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // ===== LAYER 7: RIPPLE (interrupción) =====
    if (rippleActive) {
      const rippleProgress = rippleTime / 0.6;
      if (rippleProgress < 1) {
        const currentRippleRadius = rippleProgress * rippleMaxRadius;
        const rippleAlpha = (1 - rippleProgress) * 0.7;

        ctx.beginPath();
        ctx.strokeStyle = `rgba(${colorRgb(orbColors.ring)}, ${rippleAlpha})`;
        ctx.lineWidth = 3 - rippleProgress * 2;
        ctx.arc(cx, cy, currentRippleRadius, 0, Math.PI * 2);
        ctx.stroke();

        const laggedRadius = Math.max(0, currentRippleRadius - 40);
        ctx.beginPath();
        ctx.strokeStyle = `rgba(${colorRgb(orbColors.ring)}, ${rippleAlpha * 0.6})`;
        ctx.lineWidth = 1.5;
        ctx.arc(cx, cy, laggedRadius, 0, Math.PI * 2);
        ctx.stroke();

        rippleTime += 1 / 60;
      } else {
        rippleActive = false;
        rippleTime = 0;
      }
    }

    t += 1;
    voiceIntensity *= 0.88;
    requestAnimationFrame(drawOrb);
  }

  drawOrb();

  window.addEventListener('mousemove', (event) => {
    mouseNX = (event.clientX / window.innerWidth) * 2 - 1;
    mouseNY = (event.clientY / window.innerHeight) * 2 - 1;
  });

  function triggerPulse(intensity) {
    voiceIntensity = Math.max(voiceIntensity, Math.min(0.9, intensity));
  }

  function startSpeechPulseLoop() {
    if (speechPulseTimer) clearInterval(speechPulseTimer);

    speechPulseTimer = setInterval(() => {
      if (!isSpeaking) return;
      const intensity = 0.2 + Math.random() * 0.35;
      triggerPulse(intensity);
    }, SPEECH_PULSE_INTERVAL_MS);
  }

  function stopSpeechPulseLoop() {
    if (speechPulseTimer) {
      clearInterval(speechPulseTimer);
      speechPulseTimer = null;
    }
    voiceIntensity = 0;
  }

  // ---------- RECONOCIMIENTO DE VOZ ----------
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'es-AR';
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = () => {
      isListening = true;
      setStatus('Escuchando...');
    };

    recognition.onerror = (event) => {
      console.error('SpeechRecognition error:', event.error);
      if (!isSpeaking && !isProcessing) {
        setStatus('No pude escuchar. Reintentando...');
        setTimeout(() => {
          try { recognition.start(); } catch (err) {}
        }, 1200);
      }
    };

    recognition.onresult = async (event) => {
      const texto = event.results[0][0].transcript.trim();
      if (!texto) return;

      conversationHistory.push({ role: 'user', content: texto, ts: Date.now() });
      persistSession();
      sessionMsgCount += 1;
      updateMeta();
      isListening = false;
      isProcessing = true;
      const respuesta = await preguntarGroq(texto);
      isProcessing = false;
      hablar(respuesta);
    };

    recognition.onend = () => {
      isListening = false;
      if (!isSpeaking && !isProcessing) {
        try {
          setTimeout(() => recognition.start(), RESTART_DELAY_MS);
        } catch (err) {
          console.warn('No se pudo reiniciar el reconocimiento:', err);
        }
      }
    };
  }

  // ---------- IA / GROQ ----------
  function convertSymbolsToWords(text) {
    return text
      .replace(/\*/g, 'asterisco')
      .replace(/_/g, 'guion bajo')
      .replace(/`/g, 'backtick')
      .replace(/~/g, 'tilde')
      .replace(/\|/g, 'barra')
      .replace(/#/g, 'numeral')
      .replace(/\$/g, 'peso')
      .replace(/%/g, 'porcentaje')
      .replace(/&/g, 'ampersand')
      .replace(/\^/g, 'circunflejo')
      .replace(/\[/g, 'corchete abierto')
      .replace(/\]/g, 'corchete cerrado')
      .replace(/\{/g, 'llave abierta')
      .replace(/\}/g, 'llave cerrada')
      .replace(/</g, 'menor que')
      .replace(/>/g, 'mayor que')
      .replace(/\//g, 'barra');
  }

  function formatAssistantReply(text) {
    if (!text) return '¿Qué querés que haga?';

    return text
      .replace(/\s+/g, ' ')
      .replace(/\b(soy|sos)\b/gi, 'soy')
      .trim();
  }

  async function preguntarGroq(texto) {
    setStatus('Pensando...');
    startBtn.classList.add('loading');

    try {
      const response = await fetch(API_BASE + '/api/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          history: conversationHistory,
          text: texto,
          mode: responseMode,
          style: activePreset
        })
      });

      const data = await response.json();
      if (!response.ok) {
        console.error(data);
        return data?.error || 'No pude responder ahora mismo.';
      }

      const raw = data?.text || 'No pude responder ahora mismo.';
      conversationHistory.push({ role: 'assistant', content: raw, ts: Date.now() });
      persistSession();
      updateMeta();

      currentTone = detectTone(raw);
      orbColorOverride = currentTone;

      return formatAssistantReply(raw);
    } catch (error) {
      console.error('Error backend:', error);
      return 'No pude procesar la respuesta.';
    } finally {
      startBtn.classList.remove('loading');
    }
  }

  // ---------- VOZ DEL SISTEMA ----------
  function chooseSpanishVoice() {
    if (!('speechSynthesis' in window)) return null;
    const voices = window.speechSynthesis.getVoices();
    const preferred = ['es-AR', 'es-ES', 'es'];

    for (const lang of preferred) {
      const match = voices.find(v => v.lang && v.lang.toLowerCase().startsWith(lang.toLowerCase()));
      if (match) return match;
    }

    return voices.find(v => /es/i.test(v.lang)) || voices[0] || null;
  }

  function preloadVoices() {
    if (!('speechSynthesis' in window)) return;

    const forceLoad = () => { window.speechSynthesis.getVoices(); };

    // Carga explícita y temprana
    forceLoad();

    window.speechSynthesis.onvoiceschanged = () => {
      forceLoad();
      const voices = window.speechSynthesis.getVoices();
      if (voices.length && !hasStartedOnce) {
        setStatus('Listo para hablar.');
      }
    };

    // Fallback por timer por si onvoiceschanged no dispara
    let voiceRetries = 0;
    const voiceTimer = setInterval(() => {
      if (window.speechSynthesis.getVoices().length || voiceRetries > 10) {
        clearInterval(voiceTimer);
        return;
      }
      forceLoad();
      voiceRetries += 1;
    }, 300);
  }

  function getVoiceParams(text) {
    const tone = detectTone(text) || 'neutral';
    const base = TONE_VOICE[tone] || TONE_VOICE.neutral;
    const preset = PRESET_VOICE[activePreset] || { pitch: 1, rate: 1 };
    return {
      pitch: clamp(base.pitch * preset.pitch, 0.5, 2),
      rate: clamp(base.rate * preset.rate, 0.5, 2)
    };
  }

  function showWords(text) {
    clearSubtitleTimers();
    subtitlesEl.innerHTML = '';
    const words = text.split(/\s+/).filter(Boolean);
    if (!words.length) return;

    words.forEach((word, index) => {
      const delay = index * WORD_DELAY_MS + 160;

      const wordTimer = setTimeout(() => {
        const span = document.createElement('span');
        span.className = 'word';
        span.textContent = word;
        subtitlesEl.appendChild(span);

        const fadeTimer = setTimeout(() => {
          span.classList.add('fading');
          const removeTimer = setTimeout(() => span.remove(), 700);
          subtitleTimers.push(removeTimer);
        }, Math.max(WORD_FADE_DELAY_MS, WORD_DELAY_MS * 1.6));

        subtitleTimers.push(fadeTimer);
      }, delay);

      subtitleTimers.push(wordTimer);
    });
  }

  function hablar(texto) {
    if (!texto || !('speechSynthesis' in window)) {
      isSpeaking = false;
      setStatus('La voz del sistema no está disponible en este navegador.');
      return;
    }

    currentSpeechId += 1;
    const speechId = currentSpeechId;

    clearSubtitleTimers();
    subtitlesEl.innerHTML = '';
    isSpeaking = true;
    window.speechSynthesis.cancel();

    const textoParaLeer = convertSymbolsToWords(texto);
    const utterance = new SpeechSynthesisUtterance(textoParaLeer);
    const voiceParams = getVoiceParams(texto);
    utterance.lang = 'es-AR';
    utterance.rate = voiceParams.rate;
    utterance.pitch = voiceParams.pitch;
    utterance.volume = 1;

    const voice = chooseSpanishVoice();
    if (voice) utterance.voice = voice;

    utterance.onstart = () => {
      if (speechId !== currentSpeechId) return;
      isSpeaking = true;
      playSound('bip');
      setStatus('Hablando...');
      showWords(texto);
      startSpeechPulseLoop();
      setBtnLabel('Cortar');
    };

    utterance.onboundary = () => {
      if (speechId !== currentSpeechId) return;
      triggerPulse(0.9);
    };

    utterance.onend = () => {
      if (speechId !== currentSpeechId) return;
      isSpeaking = false;
      stopSpeechPulseLoop();
      orbColorOverride = null;
      setStatus('Escuchando...');
      setResponseMode(responseMode);
      if (conversationHistory.length > 0) {
        newConvBtn.classList.add('show');
      }
      setTimeout(() => {
        if (recognition && !isProcessing) {
          try { recognition.start(); } catch (err) {}
        }
      }, 500);
    };

    utterance.onerror = () => {
      isSpeaking = false;
      setStatus('Error de voz del sistema.');
    };

    window.speechSynthesis.speak(utterance);
  }

  function startListening() {
    if (isSpeaking || isProcessing || isListening) return;

    playSound('activate');
    newConvBtn.classList.remove('show');
    if (recognition) {
      try {
        recognition.start();
      } catch (err) {
        console.warn('El reconocimiento ya está activo:', err);
      }
      return;
    }

    setStatus('Este navegador no soporta reconocimiento de voz.');
  }

  function playInterruptResponse() {
    clearSubtitleTimers();
    subtitlesEl.innerHTML = '';
    currentSpeechId += 1;

    const response = interruptResponses[Math.floor(Math.random() * interruptResponses.length)];

    const triggerFlash = () => {
      voiceIntensity = 0.8;
      rippleActive = true;
      rippleTime = 0;
      playSound('deactivate');

      setTimeout(() => {
        voiceIntensity = 0;
      }, 180);
    };

    triggerFlash();

    if (!('speechSynthesis' in window)) return;

    isSpeaking = true;
    window.speechSynthesis.cancel();

    const textoParaLeer = convertSymbolsToWords(response.text);
    const utterance = new SpeechSynthesisUtterance(textoParaLeer);
    utterance.lang = 'es-AR';
    utterance.rate = 1.1;
    utterance.pitch = response.tone === 'confused' ? 1.35 : 1.15;
    utterance.volume = 1;

    const voice = chooseSpanishVoice();
    if (voice) utterance.voice = voice;

    utterance.onstart = () => {
      setStatus('Kit: ' + response.text);
      showWords(response.text);
      startSpeechPulseLoop();
      playSound('bip');
    };

    utterance.onend = () => {
      isSpeaking = false;
      stopSpeechPulseLoop();
      setStatus('Escuchando...');
      setResponseMode(responseMode);
      setTimeout(() => {
        if (recognition && !isProcessing) {
          try { recognition.start(); } catch (err) {}
        }
      }, 500);
    };

    window.speechSynthesis.speak(utterance);
  }

  function setResponseMode(mode) {
    responseMode = mode;
    const isCompact = mode === 'compact';
    startBtn.setAttribute('data-mode', mode);

    if (isSpeaking) {
      setBtnLabel('Cortar');
      return;
    }

    if (!hasStartedOnce) {
      setBtnLabel('Iniciar');
      return;
    }

    setBtnLabel(isCompact ? 'Modo breve' : 'Modo extendido');
  }

  function setHoverState() {
    if (isSpeaking || !hasStartedOnce) return;
    setBtnLabel('Cambiar modo');
  }

  // ---------- INDICADORES ----------
  function updateMeta() {
    msgCountEl.textContent = 'Mensajes: ' + sessionMsgCount;

    const quality = computeQuality(conversationHistory);
    if (conversationHistory.length >= 2) {
      qualityPctEl.textContent = 'Calidad: ' + quality + '%';
      qualityFillEl.style.width = quality + '%';
    } else {
      qualityPctEl.textContent = 'Calidad: —';
      qualityFillEl.style.width = '0%';
    }
  }

  function computeQuality(history) {
    const userMsgs = history.filter(msg => msg.role === 'user');
    const asstMsgs = history.filter(msg => msg.role === 'assistant');
    if (!userMsgs.length) return 0;

    let score = 20;

    const questionCount = userMsgs.filter(msg => /[?¿]/.test(msg.content)).length;
    score += Math.min(25, (questionCount / userMsgs.length) * 25);

    const avgLen = asstMsgs.length
      ? asstMsgs.reduce((sum, msg) => sum + (msg.content || '').length, 0) / asstMsgs.length
      : 0;
    if (avgLen >= 20 && avgLen <= 400) score += 20;
    else if (avgLen > 400) score += 10;

    if (history.length >= 4) score += 15;
    if (history.length >= 8) score += 10;
    if (history.length >= 12) score += 10;

    return Math.min(100, Math.round(score));
  }

  // ---------- HISTORIAL ----------
  function renderHistory() {
    historyBodyEl.innerHTML = '';
    if (!conversationHistory.length) {
      historyBodyEl.textContent = 'Todavía no hay conversación.';
      return;
    }

    conversationHistory.forEach((msg) => {
      const entry = document.createElement('div');
      entry.className = 'h-entry ' + (msg.role === 'user' ? 'user' : 'assistant');

      const meta = document.createElement('div');
      meta.className = 'h-meta';

      const who = document.createElement('span');
      who.textContent = msg.role === 'user' ? 'Vos' : 'Kit';

      const when = document.createElement('span');
      const ts = typeof msg.ts === 'number' ? msg.ts : Date.now();
      when.textContent = new Date(ts).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });

      meta.appendChild(who);
      meta.appendChild(when);

      const content = document.createElement('p');
      content.style.margin = '0';
      content.textContent = msg.content || '';

      entry.appendChild(meta);
      entry.appendChild(content);
      historyBodyEl.appendChild(entry);
    });

    historyBodyEl.scrollTop = historyBodyEl.scrollHeight;
  }

  function showHistory() {
    renderHistory();
    historyOverlayEl.classList.add('show');
  }

  // ---------- PRESETS DE VOZ ----------
  function applyPresetUI() {
    presetBtns.forEach(btn => {
      btn.classList.toggle('active', btn.dataset.preset === activePreset);
    });
  }

  function setPreset(preset) {
    if (!PRESETS.includes(preset)) return;
    activePreset = preset;
    writeSession(SESSION_PRESET_KEY, preset);
    applyPresetUI();
    setStatus('Estilo de voz: ' + PRESET_LABELS[preset] + '.');
  }

  // ---------- TEMA / PALETA / VISTA ----------
  const viewModeBtn = document.getElementById('viewModeBtn');
  const paletteBtn = document.getElementById('paletteBtn');
  const themeBtn = document.getElementById('themeBtn');
  const historyBtn = document.getElementById('historyBtn');
  const historyCloseBtn = document.getElementById('historyClose');

  function applyThemeUI() {
    const isPreview = viewMode === 'preview';

    document.body.classList.toggle('theme-preview', isPreview);
    document.body.classList.toggle('palette-azul', paletteMode === 'azul');
    document.body.classList.toggle('light', themeMode === 'light');

    viewModeBtn.textContent = isPreview ? 'Preview' : 'Proyección';

    paletteBtn.classList.toggle('hidden', !isPreview);
    themeBtn.classList.toggle('hidden', !isPreview);
    if (isPreview) {
      paletteBtn.textContent = paletteMode === 'azul' ? 'Azul' : 'Rosa';
      themeBtn.textContent = themeMode === 'light' ? 'Claro' : 'Oscuro';
    }
  }

  function toggleViewMode() {
    playSound('click');
    viewMode = viewMode === 'projection' ? 'preview' : 'projection';
    writeSession(SESSION_VIEW_KEY, viewMode);
    applyThemeUI();
    setStatus(viewMode === 'projection'
      ? 'Modo proyección: negro puro para el acrílico.'
      : 'Modo preview: solo para probar sin acrílico.');
  }

  function togglePalette() {
    playSound('click');
    paletteMode = paletteMode === 'rosa' ? 'azul' : 'rosa';
    writeSession(SESSION_PALETTE_KEY, paletteMode);
    applyThemeUI();
  }

  function toggleTheme() {
    playSound('click');
    themeMode = themeMode === 'dark' ? 'light' : 'dark';
    writeSession(SESSION_THEME_KEY, themeMode);
    applyThemeUI();
  }

  // ---------- EVENTOS ----------
  startBtn.addEventListener('mouseenter', () => {
    if (!isSpeaking && hasStartedOnce) setHoverState();
  });

  startBtn.addEventListener('mouseleave', () => {
    if (!isSpeaking && hasStartedOnce) setResponseMode(responseMode);
  });

  startBtn.addEventListener('click', () => {
    if (isSpeaking) {
      playInterruptResponse();
      return;
    }

    playSound('click');

    if (isProcessing) {
      return;
    }

    if (!hasStartedOnce) {
      hasStartedOnce = true;
      setResponseMode(responseMode);
      startListening();
      return;
    }

    const nextMode = responseMode === 'compact' ? 'detailed' : 'compact';
    responseMode = nextMode;
    setResponseMode(nextMode);
    setStatus(nextMode === 'compact' ? 'Modo breve activo.' : 'Modo extendido activo.');
  });

  canvas.addEventListener('click', () => {
    if (isSpeaking) {
      playInterruptResponse();
      return;
    }
    playSound('click');
    if (!hasStartedOnce) {
      hasStartedOnce = true;
      setResponseMode(responseMode);
      startListening();
    }
  });

  newConvBtn.addEventListener('click', () => {
    if (isSpeaking || isProcessing || isListening) return;
    playSound('click');
    clearConversation();
    newConvBtn.classList.remove('show');
  });

  presetBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      playSound('click');
      setPreset(btn.dataset.preset);
    });
  });

  viewModeBtn.addEventListener('click', toggleViewMode);
  paletteBtn.addEventListener('click', togglePalette);
  themeBtn.addEventListener('click', toggleTheme);

  historyBtn.addEventListener('click', () => {
    playSound('click');
    showHistory();
  });

  historyCloseBtn.addEventListener('click', () => {
    playSound('click');
    historyOverlayEl.classList.remove('show');
  });

  historyOverlayEl.addEventListener('click', (event) => {
    if (event.target === historyOverlayEl) {
      historyOverlayEl.classList.remove('show');
    }
  });

  // ---------- INIT ----------
  loadPersistentState();
  preloadVoices();

  applyPresetUI();
  applyThemeUI();
  updateMeta();

  if (conversationHistory.length > 0) {
    newConvBtn.classList.add('show');
  }

  setResponseMode(responseMode);
</script>
</body>
</html>
