<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Jarvis</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 90vmin;
    height: 90vmin;
    max-width: 500px;
    max-height: 500px;
  }
  #status {
    position: absolute;
    bottom: 90px;
    width: 100%;
    text-align: center;
    color: #ff8da1;
    font-family: sans-serif;
    font-size: 13px;
    padding: 0 20px;
    box-sizing: border-box;
    opacity: 0.7;
  }
  #startBtn {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 28px;
    background: transparent;
    border: 1px solid rgba(255,141,161,0.35);
    border-radius: 30px;
    color: rgba(255,141,161,0.75);
    font-family: sans-serif;
    font-size: 13px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<button id="startBtn">Iniciar Jarvis</button>
<canvas id="orb" width="600" height="600"></canvas>
<div id="status">Esperando...</div>

<script>
// ---------- CONFIG ----------
const GROQ_API_KEY = "TU_API_KEY_ACA"; // pegá tu key de console.groq.com
const GROQ_MODEL = "openai/gpt-oss-120b";

// ---------- ORBE ANIMADO ----------
const canvas = document.getElementById('orb');
const ctx = canvas.getContext('2d');
let volume = 0; // 0 a 1, controla el "pulso" del orbe
let t = 0;

function drawOrb() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const baseRadius = 130;
  const pulse = baseRadius + Math.sin(t * 0.1) * 5 + volume * 40;

  const gradient = ctx.createRadialGradient(cx, cy, 10, cx, cy, pulse);
  gradient.addColorStop(0, "rgba(255,160,180,0.9)");
  gradient.addColorStop(0.5, "rgba(255,120,150,0.4)");
  gradient.addColorStop(1, "rgba(255,90,130,0)");

  ctx.beginPath();
  ctx.fillStyle = gradient;
  ctx.arc(cx, cy, pulse, 0, Math.PI * 2);
  ctx.fill();

  // anillo
  ctx.beginPath();
  ctx.strokeStyle = "rgba(255,141,161,0.6)";
  ctx.lineWidth = 2;
  ctx.arc(cx, cy, baseRadius + 20 + volume * 20, 0, Math.PI * 2);
  ctx.stroke();

  t++;
  volume *= 0.9; // decae solo si no hay nueva voz
  requestAnimationFrame(drawOrb);
}
drawOrb();

// ---------- RECONOCIMIENTO DE VOZ ----------
const statusEl = document.getElementById('status');
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = new SpeechRecognition();
recognition.lang = "es-AR";
recognition.continuous = false;
recognition.interimResults = false;

recognition.onstart = () => statusEl.textContent = "Escuchando...";
recognition.onerror = (e) => statusEl.textContent = "Error: " + e.error;

recognition.onresult = async (event) => {
  const texto = event.results[0][0].transcript;
  statusEl.textContent = "Vos: " + texto;
  const respuesta = await preguntarGroq(texto);
  statusEl.textContent = "Jarvis: " + respuesta;
  hablar(respuesta);
};

recognition.onend = () => {
  // vuelve a escuchar automáticamente después de hablar
  setTimeout(() => recognition.start(), 1000);
};

// ---------- LLAMADA A GROQ ----------
async function preguntarGroq(texto) {
  statusEl.textContent = "Pensando...";
  try {
    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + GROQ_API_KEY
      },
      body: JSON.stringify({
        model: GROQ_MODEL,
        messages: [
          { role: "system", content: "Sos Jarvis, un asistente conciso y directo. Respondé corto, en español rioplatense." },
          { role: "user", content: texto }
        ]
      })
    });
    const data = await response.json();
    if (!response.ok) {
      console.error(data);
      return "Error API: " + (data.error?.message || response.status);
    }
    return data.choices[0].message.content;
  } catch (err) {
    console.error(err);
    return "Error JS: " + err.message;
  }
}

// ---------- SÍNTESIS DE VOZ ----------
function hablar(texto) {
  const utter = new SpeechSynthesisUtterance(texto);
  utter.lang = "es-AR";

  // pulso real: sube en cada palabra nueva, decae solo (por el *0.9 del draw loop)
  utter.onboundary = (event) => {
    if (event.name === "word") {
      volume = 0.8;
    }
  };

  utter.onend = () => {
    volume = 0;
  };

  speechSynthesis.speak(utter);
}

// ---------- BOTÓN DE INICIO ----------
document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('startBtn').style.display = "none";
  recognition.start();
});
</script>
</body>
</html>
