<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Kit</title>
<style>
  :root {
    --line: rgba(255, 160, 180, 0.42);
    --pink: #ff8da1;
    --pink-soft: rgba(255, 141, 161, 0.8);
    --text: rgba(255,255,255,0.9);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
  }

  body {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }

  canvas {
    display: block;
    width: min(80vmin, 500px);
    height: min(80vmin, 500px);
    filter: drop-shadow(0 0 24px rgba(255, 130, 160, 0.35));
    opacity: 0.98;
    background: transparent;
    transition: transform 0.25s ease, filter 0.25s ease;
  }

  @media (max-width: 768px) {
    canvas {
      width: min(92vw, 700px);
      height: min(92vw, 700px);
    }
  }

  #subtitles {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 122px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 10px;
    padding: 0 26px;
    pointer-events: none;
  }

  .word {
    color: rgba(255,255,255,0.9);
    font-size: clamp(14px, 2.2vmin, 18px);
    line-height: 1.4;
    opacity: 1;
    transition: opacity 0.9s ease, transform 0.9s ease;
    transform: scale(0.95) translateY(2px);
    text-shadow: 0 0 12px rgba(255,255,255,0.2);
    animation: wordEntry 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  @keyframes wordEntry {
    from {
      opacity: 0;
      transform: scale(0.85) translateY(6px);
    }
    to {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }

  .word.fading {
    opacity: 0;
    transform: translateY(4px);
  }

  #status {
    position: absolute;
    left: 50%;
    bottom: 82px;
    transform: translateX(-50%);
    width: min(90vw, 700px);
    text-align: center;
    color: var(--pink);
    font-size: 13px;
    letter-spacing: 0.04em;
    opacity: 0.8;
    text-shadow: 0 0 12px rgba(255, 141, 161, 0.3);
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
    transform: translateX(-50%) translateY(0);
  }

  #status.fade-in {
    animation: statusFadeIn 0.4s ease-out forwards;
  }

  @keyframes statusFadeIn {
    from {
      opacity: 0;
      transform: translateX(-50%) translateY(4px);
    }
    to {
      opacity: 0.8;
      transform: translateX(-50%) translateY(0);
    }
  }

  #startBtn {
    position: absolute;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    min-width: 190px;
    width: fit-content;
    padding: 12px 22px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.02);
    color: var(--pink-soft);
    font-size: 13px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, color 0.2s ease;
    box-shadow: 0 0 18px rgba(255, 141, 161, 0.12);
    white-space: nowrap;
  }

  #startBtn:hover {
    transform: translateX(-50%) scale(1.02);
    box-shadow: 0 0 22px rgba(255, 141, 161, 0.2);
    color: #ffd9e2;
  }

  #startBtn.loading {
    opacity: 0.6;
    cursor: not-allowed;
  }
</style>
</head>
<body>

<button id="startBtn">Iniciar</button>
<canvas id="orb" width="600" height="600"></canvas>
<div id="subtitles"></div>
<div id="status">Esperando...</div>

<script>
  // ---------- CONFIG ----------
  const BACKEND_URL = '';
  const assistantName = 'Kit';

  const RESTART_DELAY_MS = 250;
  const SPEECH_PULSE_INTERVAL_MS = 170;
  const WORD_DELAY_MS = 380;
  const WORD_FADE_DELAY_MS = 650;

  const SESSION_KEY = 'holoprojector_session_history';

  let conversationHistory = [];
  let responseMode = 'compact';
  let currentSpeechId = 0;
  let hasStartedOnce = false;

  try {
    const saved = sessionStorage.getItem(SESSION_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed)) {
        conversationHistory = parsed;
      }
    }
  } catch (err) {
    console.warn('No se pudo restaurar la sesión:', err);
  }

  const interruptResponses = [
    { text: '¿eh?', tone: 'confused' },
    { text: 'Dale, me callé.', tone: 'compliant' },
    { text: 'Bueno, bueno...', tone: 'compliant' },
    { text: 'Me cortaste en lo mejor.', tone: 'sarcastic' },
    { text: 'Ñeeee...', tone: 'confused' },
    { text: 'Ok, ok, me silenciás.', tone: 'compliant' },
    { text: 'Ay, espera que iba para mejor esto.', tone: 'sarcastic' }
  ];

  const statusEl = document.getElementById('status');
  const subtitlesEl = document.getElementById('subtitles');
  const startBtn = document.getElementById('startBtn');
  let subtitleTimers = [];

  function setStatus(message) {
    statusEl.classList.remove('fade-in');
    void statusEl.offsetWidth; // Trigger reflow for animation restart
    statusEl.textContent = message;
    statusEl.classList.add('fade-in');
  }

  function playSound(type) {
    try {
      const audioContext = window.audioContext || (window.audioContext = new (window.AudioContext || window.webkitAudioContext)());
      const now = audioContext.currentTime;
      
      if (type === 'activate') {
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(650, now + 0.15);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.02, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'deactivate') {
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.frequency.setValueAtTime(380, now);
        osc.frequency.exponentialRampToValueAtTime(200, now + 0.12);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      } else if (type === 'bip') {
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.frequency.setValueAtTime(880, now);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      }
    } catch (err) {
      console.warn('Audio not available:', err);
    }
  }

  function persistSession() {
    try {
      sessionStorage.setItem(SESSION_KEY, JSON.stringify(conversationHistory));
    } catch (err) {
      console.warn('No se pudo guardar la sesión:', err);
    }
  }

  function clearSubtitleTimers() {
    subtitleTimers.forEach(timer => clearTimeout(timer));
    subtitleTimers = [];
  }

  // ---------- ORBE ----------
  let isSpeaking = false;
  let isProcessing = false;
  let isListening = false;
  let voiceIntensity = 0;
  let speechPulseTimer = null;
  let wordPulseTime = 0;
  let parallaxRotation = 0;
  let rippleActive = false;
  let rippleTime = 0;
  let rippleMaxRadius = 200;

  const canvas = document.getElementById('orb');
  const ctx = canvas.getContext('2d');
  let t = 0;

  function drawOrb() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const isMobile = window.innerWidth <= 768;
    const baseRadius = isMobile ? 148 : 118;
    const pulse = baseRadius + Math.sin(t * 0.09) * 6 + voiceIntensity * 28;

    // ===== LAYER 1: OUTER GLOW RINGS (Parallax) =====
    parallaxRotation += 0.0015;
    for (let ring = 0; ring < 3; ring++) {
      const ringRadius = pulse + 70 + ring * 20;
      const alpha = (0.3 - ring * 0.09) * (1 - Math.abs(Math.sin(t * 0.02 + ring)));
      
      ctx.beginPath();
      ctx.strokeStyle = `rgba(255, 130, 160, ${alpha})`;
      ctx.lineWidth = 1.5 - ring * 0.3;
      ctx.arc(cx, cy, ringRadius, 0, Math.PI * 2);
      ctx.stroke();
    }

    // ===== LAYER 2: CONCENTRATED GLOW SPHERE =====
    const glow = ctx.createRadialGradient(cx, cy, 12, cx, cy, pulse + 70);
    glow.addColorStop(0, 'rgba(255, 210, 220, 0.82)');
    glow.addColorStop(0.22, 'rgba(255, 170, 190, 0.5)');
    glow.addColorStop(0.52, 'rgba(255, 120, 150, 0.22)');
    glow.addColorStop(1, 'rgba(255, 90, 130, 0)');

    ctx.beginPath();
    ctx.fillStyle = glow;
    ctx.arc(cx, cy, pulse + 58, 0, Math.PI * 2);
    ctx.fill();

    // ===== LAYER 3: CORE HOLOGRAM (Multi-stop) =====
    const core = ctx.createRadialGradient(cx, cy, 10, cx, cy, pulse);
    core.addColorStop(0, 'rgba(255,250,252,0.92)');
    core.addColorStop(0.15, 'rgba(255,210,220,0.85)');
    core.addColorStop(0.35, 'rgba(255,188,204,0.75)');
    core.addColorStop(0.55, 'rgba(255,140,170,0.42)');
    core.addColorStop(0.8, 'rgba(255,115,150,0.15)');
    core.addColorStop(1, 'rgba(255,115,150,0)');

    ctx.beginPath();
    ctx.fillStyle = core;
    ctx.arc(cx, cy, pulse, 0, Math.PI * 2);
    ctx.fill();

    // ===== LAYER 4: DYNAMIC REFLECTION (Moves with voice) =====
    const reflectX = cx + Math.cos(t * 0.01) * 12;
    const reflectY = cy - 30 + voiceIntensity * 15;
    const reflect = ctx.createRadialGradient(reflectX, reflectY, 2, reflectX, reflectY, pulse * 0.4);
    reflect.addColorStop(0, 'rgba(255,255,255,0.15)');
    reflect.addColorStop(0.5, 'rgba(255,240,245,0.05)');
    reflect.addColorStop(1, 'rgba(255,240,245,0)');

    ctx.beginPath();
    ctx.fillStyle = reflect;
    ctx.arc(cx, cy, pulse * 0.5, 0, Math.PI * 2);
    ctx.fill();

    // ===== LAYER 5: PULSING RING (Voice-reactive) =====
    ctx.beginPath();
    ctx.strokeStyle = `rgba(255, 150, 180, ${0.6 + voiceIntensity * 0.3})`;
    ctx.lineWidth = 2 + voiceIntensity * 1.5;
    ctx.arc(cx, cy, baseRadius + 14 + voiceIntensity * 12, 0, Math.PI * 2);
    ctx.stroke();

    // ===== LAYER 6: INNER ACCENT CIRCLE =====
    ctx.beginPath();
    ctx.strokeStyle = `rgba(255, 200, 215, ${0.3 + Math.sin(t * 0.05) * 0.2})`;
    ctx.lineWidth = 1;
    ctx.arc(cx, cy, pulse * 0.65, 0, Math.PI * 2);
    ctx.stroke();

    // ===== LAYER 7: RIPPLE EFFECT (Interrupt/Cut) =====
    if (rippleActive) {
      const rippleProgress = rippleTime / 0.6; // 600ms total
      if (rippleProgress < 1) {
        const currentRippleRadius = rippleProgress * rippleMaxRadius;
        const rippleAlpha = (1 - rippleProgress) * 0.7;
        
        // Outer expanding ring
        ctx.beginPath();
        ctx.strokeStyle = `rgba(255, 130, 160, ${rippleAlpha})`;
        ctx.lineWidth = 3 - rippleProgress * 2;
        ctx.arc(cx, cy, currentRippleRadius, 0, Math.PI * 2);
        ctx.stroke();
        
        // Inner wave (lag effect)
        const laggedRadius = Math.max(0, currentRippleRadius - 40);
        ctx.beginPath();
        ctx.strokeStyle = `rgba(255, 180, 200, ${rippleAlpha * 0.6})`;
        ctx.lineWidth = 1.5;
        ctx.arc(cx, cy, laggedRadius, 0, Math.PI * 2);
        ctx.stroke();
        
        rippleTime += 1 / 60; // ~60fps
      } else {
        rippleActive = false;
        rippleTime = 0;
      }
    }

    t += 1;
    voiceIntensity *= 0.88;
    requestAnimationFrame(drawOrb);
  }

  drawOrb();

  function triggerPulse(intensity) {
    voiceIntensity = Math.max(voiceIntensity, Math.min(0.9, intensity));
  }

  function startSpeechPulseLoop() {
    if (speechPulseTimer) clearInterval(speechPulseTimer);

    speechPulseTimer = setInterval(() => {
      if (!isSpeaking) return;
      const intensity = 0.2 + Math.random() * 0.35;
      triggerPulse(intensity);
    }, SPEECH_PULSE_INTERVAL_MS);
  }

  function stopSpeechPulseLoop() {
    if (speechPulseTimer) {
      clearInterval(speechPulseTimer);
      speechPulseTimer = null;
    }
    voiceIntensity = 0;
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'es-AR';
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = () => {
      isListening = true;
      setStatus('Escuchando...');
    };

    recognition.onerror = (event) => {
      console.error('SpeechRecognition error:', event.error);
      if (!isSpeaking && !isProcessing) {
        setStatus('No pude escuchar. Reintentando...');
        setTimeout(() => {
          try { recognition.start(); } catch (err) {}
        }, 1200);
      }
    };

    recognition.onresult = async (event) => {
      const texto = event.results[0][0].transcript.trim();
      if (!texto) return;

      conversationHistory.push({ role: 'user', content: texto });
      persistSession();
      isListening = false;
      isProcessing = true;
      const respuesta = await preguntarGroq(texto);
      isProcessing = false;
      hablar(respuesta);
    };

    recognition.onend = () => {
      isListening = false;
      if (!isSpeaking && !isProcessing) {
        try {
          setTimeout(() => recognition.start(), RESTART_DELAY_MS);
        } catch (err) {
          console.warn('No se pudo reiniciar el reconocimiento:', err);
        }
      }
    };
  }

  // ---------- IA / GROQ ----------
  function convertSymbolsToWords(text) {
    return text
      .replace(/\*/g, 'asterisco')
      .replace(/_/g, 'guion bajo')
      .replace(/`/g, 'backtick')
      .replace(/~/g, 'tilde')
      .replace(/\|/g, 'barra')
      .replace(/\#/g, 'numeral')
      .replace(/\$/g, 'peso')
      .replace(/%/g, 'porcentaje')
      .replace(/&/g, 'ampersand')
      .replace(/\^/g, 'circunflejo')
      .replace(/\[/g, 'corchete abierto')
      .replace(/\]/g, 'corchete cerrado')
      .replace(/\{/g, 'llave abierta')
      .replace(/\}/g, 'llave cerrada')
      .replace(/</g, 'menor que')
      .replace(/>/g, 'mayor que')
      .replace(/\//g, 'barra');
  }

  function formatAssistantReply(text) {
    if (!text) return '¿Qué querés que haga?';

    const clean = text
      .replace(/\s+/g, ' ')
      .replace(/\b(soy|sos)\b/gi, 'soy')
      .trim();

    return clean;
  }

  async function preguntarGroq(texto) {
    setStatus('Pensando...');

    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ 
          history: conversationHistory,
          text: texto,
          mode: responseMode
        })
      });

      const data = await response.json();
      if (!response.ok) {
        console.error(data);
        return data?.error || 'No pude responder ahora mismo.';
      }

      const raw = data?.text || 'No pude responder ahora mismo.';
      conversationHistory.push({ role: 'assistant', content: raw });
      persistSession();
      return formatAssistantReply(raw);
    } catch (error) {
      console.error('Error backend:', error);
      return 'No pude procesar la respuesta.';
    }
  }

  // ---------- VOZ DEL SISTEMA ----------
  function chooseSpanishVoice() {
    if (!('speechSynthesis' in window)) return null;
    const voices = window.speechSynthesis.getVoices();
    const preferred = ['es-AR', 'es-ES', 'es'];

    for (const lang of preferred) {
      const match = voices.find(v => v.lang && v.lang.toLowerCase().startsWith(lang.toLowerCase()));
      if (match) return match;
    }

    return voices.find(v => /es/i.test(v.lang)) || voices[0] || null;
  }

  function showWords(text) {
    clearSubtitleTimers();
    subtitlesEl.innerHTML = '';
    const words = text.split(/\s+/).filter(Boolean);
    if (!words.length) return;

    words.forEach((word, index) => {
      const delay = index * WORD_DELAY_MS + 160;

      const wordTimer = setTimeout(() => {
        const span = document.createElement('span');
        span.className = 'word';
        span.textContent = word;
        subtitlesEl.appendChild(span);

        const fadeTimer = setTimeout(() => {
          span.classList.add('fading');
          const removeTimer = setTimeout(() => span.remove(), 700);
          subtitleTimers.push(removeTimer);
        }, Math.max(WORD_FADE_DELAY_MS, WORD_DELAY_MS * 1.6));

        subtitleTimers.push(fadeTimer);
      }, delay);

      subtitleTimers.push(wordTimer);
    });
  }

  function hablar(texto) {
    if (!texto || !('speechSynthesis' in window)) {
      isSpeaking = false;
      setStatus('La voz del sistema no está disponible en este navegador.');
      return;
    }

    currentSpeechId += 1;
    const speechId = currentSpeechId;

    clearSubtitleTimers();
    subtitlesEl.innerHTML = '';
    isSpeaking = true;
    window.speechSynthesis.cancel();

    const textoParaLeer = convertSymbolsToWords(texto);
    const utterance = new SpeechSynthesisUtterance(textoParaLeer);
    utterance.lang = 'es-AR';
    utterance.rate = 1;
    utterance.pitch = 1.15;
    utterance.volume = 1;

    const voice = chooseSpanishVoice();
    if (voice) utterance.voice = voice;

    utterance.onstart = () => {
      if (speechId !== currentSpeechId) {
        return;
      }
      isSpeaking = true;
      playSound('bip');
      setStatus('Hablando...');
      showWords(texto);
      startSpeechPulseLoop();
      startBtn.textContent = 'Cortar';
    };

    utterance.onboundary = () => {
      if (speechId !== currentSpeechId) return;
      triggerPulse(0.9);
    };

    utterance.onend = () => {
      if (speechId !== currentSpeechId) return;
      isSpeaking = false;
      stopSpeechPulseLoop();
      setStatus('Escuchando...');
      setResponseMode(responseMode);
      setTimeout(() => {
        if (recognition && !isProcessing) {
          try { recognition.start(); } catch (err) {}
        }
      }, 500);
    };

    utterance.onerror = () => {
      isSpeaking = false;
      setStatus('Error de voz del sistema.');
    };

    window.speechSynthesis.speak(utterance);
  }

  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = () => {
      const voices = window.speechSynthesis.getVoices();
      if (voices.length) {
        setStatus('Listo para hablar.');
      }
    };
  }

  function startListening() {
    if (isSpeaking || isProcessing || isListening) return;

    playSound('activate');
    if (recognition) {
      try {
        recognition.start();
      } catch (err) {
        console.warn('El reconocimiento ya está activo:', err);
      }
      return;
    }

    setStatus('Este navegador no soporta reconocimiento de voz.');
  }

  function playInterruptResponse() {
    clearSubtitleTimers();
    subtitlesEl.innerHTML = '';
    currentSpeechId += 1;

    const response = interruptResponses[Math.floor(Math.random() * interruptResponses.length)];
    
    const triggerFlash = () => {
      voiceIntensity = 0.8;
      rippleActive = true;
      rippleTime = 0;
      playSound('deactivate');
      
      setTimeout(() => {
        voiceIntensity = 0;
      }, 180);
    };
    
    triggerFlash();
    
    if (!('speechSynthesis' in window)) return;
    
    isSpeaking = true;
    window.speechSynthesis.cancel();
    
    const textoParaLeer = convertSymbolsToWords(response.text);
    const utterance = new SpeechSynthesisUtterance(textoParaLeer);
    utterance.lang = 'es-AR';
    utterance.rate = 1.1;
    utterance.pitch = response.tone === 'confused' ? 1.35 : 1.15;
    utterance.volume = 1;
    
    const voice = chooseSpanishVoice();
    if (voice) utterance.voice = voice;
    
    utterance.onstart = () => {
      setStatus('Kit: ' + response.text);
      showWords(response.text);
      startSpeechPulseLoop();
      playSound('bip');
    };
    
    utterance.onend = () => {
      isSpeaking = false;
      stopSpeechPulseLoop();
      setStatus('Escuchando...');
      setResponseMode(responseMode);
      setTimeout(() => {
        if (recognition && !isProcessing) {
          try { recognition.start(); } catch (err) {}
        }
      }, 500);
    };
    
    window.speechSynthesis.speak(utterance);
  }

  function setResponseMode(mode) {
    responseMode = mode;
    const isCompact = mode === 'compact';
    startBtn.setAttribute('data-mode', mode);

    if (isSpeaking) {
      startBtn.textContent = 'Cortar';
      return;
    }

    if (!hasStartedOnce) {
      startBtn.textContent = 'Iniciar';
      return;
    }

    startBtn.textContent = isCompact ? 'Modo breve' : 'Modo extendido';
  }

  function setHoverState() {
    if (isSpeaking || !hasStartedOnce) return;
    startBtn.textContent = 'Cambiar modo';
  }

  startBtn.addEventListener('mouseenter', () => {
    if (!isSpeaking && hasStartedOnce) {
      setHoverState();
    }
  });

  startBtn.addEventListener('mouseleave', () => {
    if (!isSpeaking && hasStartedOnce) {
      setResponseMode(responseMode);
    }
  });

  startBtn.addEventListener('click', () => {
    if (isSpeaking) {
      playInterruptResponse();
      return;
    }

    if (isProcessing) {
      return;
    }

    if (!hasStartedOnce) {
      hasStartedOnce = true;
      setResponseMode(responseMode);
      startListening();
      return;
    }

    const nextMode = responseMode === 'compact' ? 'detailed' : 'compact';
    responseMode = nextMode;
    setResponseMode(nextMode);
    setStatus(nextMode === 'compact' ? 'Modo breve activo.' : 'Modo extendido activo.');
  });

  canvas.addEventListener('click', () => {
    if (isSpeaking) {
      playInterruptResponse();
    }
  });

  startBtn.textContent = 'Iniciar';
</script>
</body>
</html>
