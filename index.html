<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Kit</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 90vmin;
    height: 90vmin;
    max-width: 500px;
    max-height: 500px;
  }
  #subtitles {
    position: absolute;
    bottom: 130px;
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 4px;
    padding: 0 30px;
    box-sizing: border-box;
  }
  .word {
    color: rgba(255,255,255,0.85);
    font-family: sans-serif;
    font-size: 16px;
    opacity: 1;
    transition: opacity 1s ease;
  }
  .word.fading {
    opacity: 0;
  }
  #status {
    position: absolute;
    bottom: 90px;
    width: 100%;
    text-align: center;
    color: #ff8da1;
    font-family: sans-serif;
    font-size: 13px;
    padding: 0 20px;
    box-sizing: border-box;
    opacity: 0.7;
  }
  #startBtn {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 28px;
    background: transparent;
    border: 1px solid rgba(255,141,161,0.35);
    border-radius: 30px;
    color: rgba(255,141,161,0.75);
    font-family: sans-serif;
    font-size: 13px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<button id="startBtn">Iniciar asistente</button>
<canvas id="orb" width="600" height="600"></canvas>
<div id="subtitles"></div>
<div id="status">Esperando...</div>

<script>
// ---------- CONFIG ----------
const GROQ_API_KEY = "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";
const GROQ_MODEL = "openai/gpt-oss-120b";
const ELEVEN_API_KEY = "sk_e740eb9df4f7fdb8fbd5ffe8e36987a006d899d844d47477";
const ELEVEN_VOICE_ID = "MF3mGyEYCl7XYWbV9V6O";

// ---------- ORBE ANIMADO ----------
const canvas = document.getElementById('orb');
const ctx = canvas.getContext('2d');
let volume = 0; // 0 a 1, controla el "pulso" del orbe
let t = 0;

function drawOrb() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const baseRadius = 130;
  const pulse = baseRadius + Math.sin(t * 0.1) * 5 + volume * 40;

  const gradient = ctx.createRadialGradient(cx, cy, 10, cx, cy, pulse);
  gradient.addColorStop(0, "rgba(255,160,180,0.9)");
  gradient.addColorStop(0.5, "rgba(255,120,150,0.4)");
  gradient.addColorStop(1, "rgba(255,90,130,0)");

  ctx.beginPath();
  ctx.fillStyle = gradient;
  ctx.arc(cx, cy, pulse, 0, Math.PI * 2);
  ctx.fill();

  // anillo
  ctx.beginPath();
  ctx.strokeStyle = "rgba(255,141,161,0.6)";
  ctx.lineWidth = 2;
  ctx.arc(cx, cy, baseRadius + 20 + volume * 20, 0, Math.PI * 2);
  ctx.stroke();

  t++;
  volume *= 0.93; // decae más suave, pulso menos abrupto
  requestAnimationFrame(drawOrb);
}
drawOrb();

// ---------- RECONOCIMIENTO DE VOZ ----------
const statusEl = document.getElementById('status');
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = new SpeechRecognition();
recognition.lang = "es-AR";
recognition.continuous = false;
recognition.interimResults = false;

recognition.onstart = () => statusEl.textContent = "Escuchando...";
recognition.onerror = (e) => statusEl.textContent = "Error: " + e.error;

recognition.onresult = async (event) => {
  const texto = event.results[0][0].transcript;
  statusEl.textContent = "Vos: " + texto;
  const respuesta = await preguntarGroq(texto);
  statusEl.textContent = "Kit: " + respuesta;
  hablar(respuesta);
};

recognition.onend = () => {
  // el reinicio ahora lo dispara el audio de Kit al terminar de hablar (ver reproducirConAnalisis)
};

// ---------- LLAMADA A GROQ ----------
async function preguntarGroq(texto) {
  statusEl.textContent = "Pensando...";
  try {
    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + GROQ_API_KEY
      },
      body: JSON.stringify({
        model: GROQ_MODEL,
        messages: [
          { role: "system", content: "Sos Kit, un asistente androgino, conciso y directo. Respondé corto, en español rioplatense." },
          { role: "user", content: texto }
        ]
      })
    });
    const data = await response.json();
    if (!response.ok) {
      console.error(data);
      return "Error API: " + (data.error?.message || response.status);
    }
    return data.choices[0].message.content;
  } catch (err) {
    console.error(err);
    return "Error JS: " + err.message;
  }
}

// ---------- SÍNTESIS DE VOZ (ElevenLabs + audio real) ----------
const subtitlesEl = document.getElementById('subtitles');
let audioCtx = null;
let analyser = null;

function agregarSubtitulo(palabra) {
  const span = document.createElement('span');
  span.className = 'word';
  span.textContent = palabra;
  subtitlesEl.appendChild(span);

  setTimeout(() => {
    span.classList.add('fading');
    setTimeout(() => span.remove(), 1000);
  }, 2500);
}

async function hablar(texto) {
  subtitlesEl.innerHTML = "";
  statusEl.textContent = "Generando voz...";
  try {
    const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${ELEVEN_VOICE_ID}`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "xi-api-key": ELEVEN_API_KEY
      },
      body: JSON.stringify({
        text: texto,
        model_id: "eleven_multilingual_v2",
        voice_settings: { stability: 0.4, similarity_boost: 0.8 }
      })
    });
    if (!response.ok) {
      statusEl.textContent = "Error TTS: " + response.status;
      recognition.start();
      return;
    }
    const audioBlob = await response.blob();
    reproducirConAnalisis(URL.createObjectURL(audioBlob), texto);
  } catch (err) {
    console.error(err);
    statusEl.textContent = "Error TTS: " + err.message;
    recognition.start();
  }
}

function reproducirConAnalisis(audioUrl, texto) {
  const audio = new Audio(audioUrl);

  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
  }
  const source = audioCtx.createMediaElementSource(audio);
  source.connect(analyser);
  analyser.connect(audioCtx.destination);

  const data = new Uint8Array(analyser.frequencyBinCount);

  function actualizarVolumen() {
    analyser.getByteFrequencyData(data);
    const promedio = data.reduce((a, b) => a + b, 0) / data.length;
    volume = promedio / 255; // volumen real, 0 a 1
    if (!audio.paused && !audio.ended) requestAnimationFrame(actualizarVolumen);
  }

  // subtítulos: reparto aproximado de las palabras en la duración total del audio
  const palabras = texto.split(/\s+/);
  audio.onloadedmetadata = () => {
    const porPalabra = audio.duration / palabras.length;
    palabras.forEach((p, i) => setTimeout(() => agregarSubtitulo(p), i * porPalabra * 1000));
  };

  audio.onplay = () => {
    statusEl.textContent = "Kit hablando...";
    actualizarVolumen();
  };
  audio.onended = () => {
    volume = 0;
    setTimeout(() => recognition.start(), 500);
  };
  audio.play();
}

// ---------- BOTÓN DE INICIO ----------
document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('startBtn').style.display = "none";
  recognition.start();
});
</script>
</body>
</html>
